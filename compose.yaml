services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: auction
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: auctionserver
    secrets:
      - postgres_password
    cpus: 1
    mem_limit: 512m
    ports:
      - "5436:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auction -d auctionserver"]
      interval: 2s
      timeout: 3s
      retries: 15

  pgbouncer:
    image: edoburu/pgbouncer:v1.26.1-p0
    restart: unless-stopped
    cpus: 1
    mem_limit: 64m
    volumes:
      - ./Infrastructure/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./Infrastructure/secrets/pgbouncer-userlist.txt:/etc/pgbouncer/userlist.txt:ro
    networks:
      - data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U auction -d auctionserver"]
      interval: 2s
      timeout: 3s
      retries: 15

  pgbackup:
    image: prodrigestivill/postgres-backup-local:16-alpine
    restart: unless-stopped
    cpus: 1
    mem_limit: 128m
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: auctionserver
      POSTGRES_USER: auction
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: "7"
      BACKUP_KEEP_WEEKS: "4"
      BACKUP_KEEP_MONTHS: "6"
    secrets:
      - postgres_password
    volumes:
      - pgbackups:/backups
    networks:
      - data
    depends_on:
      postgres:
        condition: service_healthy

  seaweedfs:
    image: chrislusf/seaweedfs:4.50
    command: server -s3 -dir=/data
    restart: unless-stopped
    volumes:
      - seaweeddata:/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command:
      - /bin/sh
      - -c
      - >-
        exec redis-server
        --requirepass "$$(cat /run/secrets/redis_password)"
        --maxmemory 64mb
        --maxmemory-policy allkeys-lru
        --save "" --appendonly no
    secrets:
      - redis_password
    cpus: 1
    mem_limit: 128m
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/secrets/redis_password)\" redis-cli ping | grep -q PONG"]
      interval: 2s
      timeout: 3s
      retries: 15

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    restart: unless-stopped
    cpus: 1
    mem_limit: 384m
    volumes:
      - ./Infrastructure/secrets/rabbitmq-defaults.conf:/etc/rabbitmq/conf.d/20-auction.conf:ro
    ports:
      - "127.0.0.1:15672:15672"
    networks:
      - data
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  vault:
    image: openbao/openbao:2.7.2
    restart: unless-stopped
    cpus: 1
    mem_limit: 256m
    entrypoint:
      - /bin/sh
      - -c
      - >-
        exec bao server -dev
        -dev-root-token-id="$$(cat /run/secrets/vault_root_token)"
        -dev-listen-address=0.0.0.0:8200
    secrets:
      - vault_root_token
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8200/v1/sys/health"]
      interval: 2s
      timeout: 3s
      retries: 15

  vault-init:
    image: openbao/openbao:2.7.2
    user: "0"
    restart: "no"
    entrypoint: ["/bin/sh", "/vault-init.sh"]
    volumes:
      - ./Infrastructure/vault/vault-init.sh:/vault-init.sh:ro
      - vaultcreds:/vault/credentials
    secrets:
      - vault_root_token
      - postgres_password
      - rabbitmq_password
      - redis_password
      - jwt_key
      - bots_api_key
    networks:
      - data
    depends_on:
      vault:
        condition: service_healthy

  api:
    build: ./Backend
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    stop_grace_period: 30s
    cpus: 2
    mem_limit: 1g
    environment:
      Database__MigrateOnStartup: "true"
      Profiles__Storage__ServiceUrl: "http://seaweedfs:8333"
      Cache__Enabled: "true"
      Observability__Enabled: "true"
      Observability__OtlpEndpoint: "http://otel-collector:4317"
      Gateway__Enabled: "true"
      Gateway__TrustedNetworks__0: "172.16.80.0/24"
      Messaging__Transport: "Rabbit"
      Messaging__Rabbit__HostName: "rabbitmq"
      Messaging__Rabbit__UserName: "auction"
      RateLimiting__Enabled: "true"
      RateLimiting__Writes__TokenLimit: "40"
      RateLimiting__Writes__TokensPerPeriod: "20"
      RateLimiting__Writes__PeriodSeconds: "1"
      RateLimiting__HotWrites__TokenLimit: "10"
      RateLimiting__HotWrites__TokensPerPeriod: "5"
      RateLimiting__HotWrites__PeriodSeconds: "1"
      RateLimiting__Uploads__TokenLimit: "3"
      RateLimiting__Uploads__TokensPerPeriod: "1"
      RateLimiting__Uploads__PeriodSeconds: "10"
      Vault__Enabled: "true"
      Vault__Address: "http://vault:8200"
      Vault__RoleIdFile: "/vault/credentials/role-id"
      Vault__SecretIdFile: "/vault/credentials/secret-id"
      Vault__SecretPath: "auction/api"
    volumes:
      - vaultcreds:/vault/credentials:ro
    networks:
      - edge
      - data
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080
          && printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          && head -n 1 <&3 | grep -q ' 200 '
      interval: 2s
      timeout: 3s
      retries: 15

  gateway:
    image: nginx:1.28.3-alpine
    restart: unless-stopped
    cpus: 1
    mem_limit: 128m
    ports:
      - "8080:80"
    environment:
      NGINX_ENTRYPOINT_QUIET_LOGS: "1"
    volumes:
      - ./Infrastructure/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - edge
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/gateway-health"]
      interval: 2s
      timeout: 3s
      retries: 15

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.163.2
    restart: unless-stopped
    volumes:
      - ./Infrastructure/observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    networks:
      - data

  prometheus:
    image: prom/prometheus:v3.15.1
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    volumes:
      - ./Infrastructure/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./Infrastructure/observability/prometheus-rules.yml:/etc/prometheus/rules.yml:ro
      - prometheusdata:/prometheus
    networks:
      - data

  tempo:
    image: grafana/tempo:3.1.1
    restart: unless-stopped
    command:
      - "-config.file=/etc/tempo/tempo.yaml"
    volumes:
      - ./Infrastructure/observability/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempodata:/var/tempo
    networks:
      - data

  grafana:
    image: grafana/grafana:13.2.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./Infrastructure/observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - grafanadata:/var/lib/grafana
    networks:
      - edge
      - data
    depends_on:
      - prometheus
      - tempo

  k6:
    image: grafana/k6:2.3.0
    profiles:
      - loadtest
    user: "1000:1000"
    environment:
      BASE_URL: "http://api:8080"
    volumes:
      - ./Infrastructure/k6:/scripts
    working_dir: /scripts
    networks:
      - edge
    depends_on:
      - api

networks:
  edge:
    ipam:
      config:
        - subnet: 172.16.80.0/24
  data:

secrets:
  postgres_password:
    file: ./Infrastructure/secrets/postgres-password.secret
  rabbitmq_password:
    file: ./Infrastructure/secrets/rabbitmq-password.secret
  redis_password:
    file: ./Infrastructure/secrets/redis-password.secret
  jwt_key:
    file: ./Infrastructure/secrets/jwt-key.secret
  bots_api_key:
    file: ./Infrastructure/secrets/bots-api-key.secret
  vault_root_token:
    file: ./Infrastructure/secrets/vault-root-token.secret

volumes:
  pgdata:
  pgbackups:
  seaweeddata:
  prometheusdata:
  tempodata:
  grafanadata:
  vaultcreds:
