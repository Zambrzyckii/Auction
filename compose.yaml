services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: auction
      POSTGRES_PASSWORD: auction
      POSTGRES_DB: auctionserver
    cpus: 1
    mem_limit: 512m
    ports:
      - "5436:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auction -d auctionserver"]
      interval: 2s
      timeout: 3s
      retries: 15

  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    command: server -s3 -dir=/data
    restart: unless-stopped
    volumes:
      - seaweeddata:/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build: ./Backend
    restart: unless-stopped
    cpus: 2
    mem_limit: 1g
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=auctionserver;Username=auction;Password=auction"
      Jwt__Key: "local-dev-signing-key-at-least-32-chars-long"
      Bots__ApiKey: "local-dev-bot-api-key"
      Database__MigrateOnStartup: "true"
      Profiles__Storage__ServiceUrl: "http://seaweedfs:8333"
      Observability__Enabled: "true"
      Observability__OtlpEndpoint: "http://otel-collector:4317"
      Gateway__Enabled: "true"
      Gateway__TrustedNetworks__0: "172.16.80.0/24"
    networks:
      - edge
      - data
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080
          && printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          && head -n 1 <&3 | grep -q ' 200 '
      interval: 2s
      timeout: 3s
      retries: 15

  gateway:
    image: nginx:1.28.3-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      NGINX_ENTRYPOINT_QUIET_LOGS: "1"
    volumes:
      - ./Infrastructure/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - edge
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/gateway-health"]
      interval: 2s
      timeout: 3s
      retries: 15

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.163.2
    restart: unless-stopped
    volumes:
      - ./Infrastructure/observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    networks:
      - data

  prometheus:
    image: prom/prometheus:v3.15.1
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    volumes:
      - ./Infrastructure/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus
    networks:
      - data

  tempo:
    image: grafana/tempo:3.1.1
    restart: unless-stopped
    command:
      - "-config.file=/etc/tempo/tempo.yaml"
    volumes:
      - ./Infrastructure/observability/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempodata:/var/tempo
    networks:
      - data

  grafana:
    image: grafana/grafana:13.2.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./Infrastructure/observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - grafanadata:/var/lib/grafana
    networks:
      - edge
      - data
    depends_on:
      - prometheus
      - tempo

  k6:
    image: grafana/k6:2.3.0
    profiles:
      - loadtest
    user: "1000:1000"
    environment:
      BASE_URL: "http://api:8080"
    volumes:
      - ./Infrastructure/k6:/scripts
    working_dir: /scripts
    networks:
      - edge
    depends_on:
      - api

networks:
  edge:
    ipam:
      config:
        - subnet: 172.16.80.0/24
  data:

volumes:
  pgdata:
  seaweeddata:
  prometheusdata:
  tempodata:
  grafanadata:
