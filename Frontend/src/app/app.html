<header class="topbar">
  <nav>
    <a routerLink="/auctions" routerLinkActive="active">Auctions</a>
    <a routerLink="/inventory" routerLinkActive="active">Inventory</a>
    <a routerLink="/wallet" routerLinkActive="active">Wallet</a>
    <a routerLink="/transfers" routerLinkActive="active">Transfers</a>
    <a routerLink="/bank" routerLinkActive="active">Bank</a>
    <a routerLink="/casino" routerLinkActive="active">Casino</a>
    <a routerLink="/pawnshop" routerLinkActive="active">Pawnshop</a>
    <a routerLink="/profile" routerLinkActive="active">Profile</a>
  </nav>
  <div class="session">
    @if (session.isLoggedIn()) {
      <span>{{ session.email() }}</span>
      <button type="button" (click)="logout()">Log out</button>
    } @else {
      <a routerLink="/login">Log in</a>
      <a routerLink="/register">Register</a>
    }
  </div>
</header>
<main>
  <router-outlet />
</main>
