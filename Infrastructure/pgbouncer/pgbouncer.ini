[databases]
auctionserver = host=postgres port=5432 dbname=auctionserver

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
stats_users = auction
default_pool_size = 25
max_db_connections = 40
max_client_conn = 500
reserve_pool_size = 10
