user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 1024;
    gzip_vary on;

    upstream auction_api {
        server api:8080;
        keepalive 32;
    }

    map $http_authorization $anonymous_key {
        "" $binary_remote_addr;
        default "";
    }

    map $http_authorization $authenticated_key {
        "" "";
        default $binary_remote_addr;
    }

    limit_req_zone $anonymous_key zone=anonymous:10m rate=20r/s;
    limit_req_zone $authenticated_key zone=authenticated:10m rate=60r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=1r/s;

    server {
        listen 80;
        client_max_body_size 64k;

        limit_req zone=anonymous burst=40 nodelay;
        limit_req zone=authenticated burst=120 nodelay;
        limit_req_status 429;
        error_page 429 = @too_many_requests;
        error_page 413 = @request_too_large;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;

        location = /gateway-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /api/profiles/me/avatar {
            client_max_body_size 4m; 
            proxy_pass http://auction_api;
        }

        location ~ ^/api/users/(login|register)$ {
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://auction_api;
        }

        location /api/ {
            proxy_pass http://auction_api;
        }

        location /health {
            proxy_pass http://auction_api;
        }

        location /openapi/ {
            allow 127.0.0.1;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
            proxy_pass http://auction_api;
        }

        location @too_many_requests {
            default_type application/json;
            add_header Retry-After 1 always;
            return 429 '{"error":"Too many requests"}';
        }

        location @request_too_large {
            default_type application/json;
            return 413 '{"error":"Request body too large"}';
        }

        location / {
            return 404;
        }
    }
}
