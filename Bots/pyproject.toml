[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "auction-bots"
version = "0.1.0"
description = "Scripted market bot fleet for the auction server"
requires-python = ">=3.13"
dependencies = [
    "aio-pika==10.2.3",
    "httpx==0.28.1",
    "pydantic==2.14.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "testcontainers[rabbitmq]==4.15.0",
    "ruff==0.17.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/auction_bots"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "broker: needs Docker to run a RabbitMQ container",
]
filterwarnings = [
    "ignore::DeprecationWarning:testcontainers",
    "ignore::DeprecationWarning:pika",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
