name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_NOLOGO: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build Backend/AuctionServer.slnx

  unit-tests:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test Backend/tests/AuctionServer.Modules.Auctions.Tests --filter "FullyQualifiedName!~IntegrationTests"

  gateway-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker run --rm -e NGINX_ENTRYPOINT_QUIET_LOGS=1 -v "$PWD/Infrastructure/gateway/nginx.conf:/etc/nginx/nginx.conf:ro" nginx:1.28.3-alpine nginx -t

  integration-tests:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test Backend/tests/AuctionServer.Modules.Auctions.Tests --filter "FullyQualifiedName~IntegrationTests"
      - run: dotnet test Backend/tests/AuctionServer.Modules.Wallets.Tests
      - run: dotnet test Backend/tests/AuctionServer.Modules.Identity.Tests
      - run: dotnet test Backend/tests/AuctionServer.Modules.Inventory.Tests
      - run: dotnet test Backend/tests/AuctionServer.Modules.Warehouses.Tests
      - run: dotnet test Backend/tests/AuctionServer.Modules.Banking.Tests
      - run: dotnet test Backend/tests/AuctionServer.Modules.Pawnshop.Tests
      - run: dotnet test Backend/tests/AuctionServer.Modules.Casino.Tests
      - run: dotnet test Backend/tests/AuctionServer.Modules.Profiles.Tests
      - run: dotnet test Backend/tests/AuctionServer.Api.Tests
