name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_NOLOGO: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('Backend/**/*.csproj') }}
          restore-keys: nuget-
      - run: dotnet build Backend/AuctionServer.slnx

  unit-tests:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('Backend/**/*.csproj') }}
          restore-keys: nuget-
      - run: dotnet test Backend/tests/AuctionServer.Modules.Auctions.Tests --filter "FullyQualifiedName!~IntegrationTests"

  gateway-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker run --rm -e NGINX_ENTRYPOINT_QUIET_LOGS=1 -v "$PWD/Infrastructure/gateway/nginx.conf:/etc/nginx/nginx.conf:ro" nginx:1.28.3-alpine nginx -t

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./Infrastructure/secrets/gen-secrets.sh
      - run: docker compose config -q
      - run: IMAGE_TAG=ci docker compose -f compose.yaml -f compose.vps.yaml config -q

  integration-tests:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('Backend/**/*.csproj') }}
          restore-keys: nuget-
      - run: dotnet test Backend/tests/AuctionServer.Modules.Auctions.Tests --filter "FullyQualifiedName~IntegrationTests"
      - run: dotnet test Backend/tests/AuctionServer.Modules.Wallets.Tests
      - run: dotnet test Backend/tests/AuctionServer.Modules.Identity.Tests
      - run: dotnet test Backend/tests/AuctionServer.Modules.Inventory.Tests
      - run: dotnet test Backend/tests/AuctionServer.Modules.Warehouses.Tests
      - run: dotnet test Backend/tests/AuctionServer.Modules.Banking.Tests
      - run: dotnet test Backend/tests/AuctionServer.Modules.Pawnshop.Tests
      - run: dotnet test Backend/tests/AuctionServer.Modules.Casino.Tests
      - run: dotnet test Backend/tests/AuctionServer.Modules.Profiles.Tests
      - run: dotnet test Backend/tests/AuctionServer.Shared.Infrastructure.Tests
      - run: dotnet test Backend/tests/AuctionServer.Api.Tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npx ng build
      - run: npx ng test --watch=false

  bots:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Bots
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: Bots/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  image:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: Backend
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/zambrzyckii/auction:latest
            ghcr.io/zambrzyckii/auction:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, gateway-config, compose-config, frontend, bots, image]
    if: github.event_name == 'push'
    timeout-minutes: 15
    concurrency:
      group: vps-deploy
      cancel-in-progress: false
    steps:
      - env:
          SSH_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/vps_deploy
          chmod 600 ~/.ssh/vps_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/vps_deploy -o IdentitiesOnly=yes -o BatchMode=yes "deploy@$VPS_HOST" "auctions $GITHUB_SHA"
