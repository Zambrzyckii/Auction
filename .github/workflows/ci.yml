name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_NOLOGO: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('Backend/**/*.csproj') }}
          restore-keys: nuget-
      - run: dotnet build Backend/AuctionServer.slnx

  unit-tests:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('Backend/**/*.csproj') }}
          restore-keys: nuget-
      - run: dotnet test Backend/tests/AuctionServer.Modules.Auctions.Tests --filter "FullyQualifiedName!~IntegrationTests"

  gateway-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker run --rm -e NGINX_ENTRYPOINT_QUIET_LOGS=1 -v "$PWD/Infrastructure/gateway/nginx.conf:/etc/nginx/nginx.conf:ro" nginx:1.28.3-alpine nginx -t

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./Infrastructure/secrets/gen-secrets.sh
      - run: docker compose config -q

  integration-tests:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('Backend/**/*.csproj') }}
          restore-keys: nuget-
      - run: dotnet test Backend/tests/AuctionServer.Modules.Auctions.Tests --filter "FullyQualifiedName~IntegrationTests"
      - run: dotnet test Backend/tests/AuctionServer.Modules.Wallets.Tests
      - run: dotnet test Backend/tests/AuctionServer.Modules.Identity.Tests
      - run: dotnet test Backend/tests/AuctionServer.Modules.Inventory.Tests
      - run: dotnet test Backend/tests/AuctionServer.Modules.Warehouses.Tests
      - run: dotnet test Backend/tests/AuctionServer.Modules.Banking.Tests
      - run: dotnet test Backend/tests/AuctionServer.Modules.Pawnshop.Tests
      - run: dotnet test Backend/tests/AuctionServer.Modules.Casino.Tests
      - run: dotnet test Backend/tests/AuctionServer.Modules.Profiles.Tests
      - run: dotnet test Backend/tests/AuctionServer.Shared.Infrastructure.Tests
      - run: dotnet test Backend/tests/AuctionServer.Api.Tests

  image:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: Backend
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/zambrzyckii/auction:latest
            ghcr.io/zambrzyckii/auction:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
